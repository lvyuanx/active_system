[project]
name = "active-system-backend"
version = "0.1.0"
description = "活动系统 FastAPI 后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "Pillow>=11.0,<13.0",
    "pydantic-settings>=2.6,<3.0",
    "PyJWT>=2.10,<3.0",
    "uvicorn[standard]>=0.34,<1.0"
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
