map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
    http http;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location = / { return 302 /admin/$is_args$args; }
    location = /admin { return 301 /admin/$is_args$args; }
    location = /screen { return 301 /screen/$is_args$args; }
    location = /user { return 301 /user/$is_args$args; }
    location ~ ^/(admin|screen|user)/assets/ { try_files $uri =404; }
    location ~ ^/(admin|screen|user)/.*\.[^/]+$ { try_files $uri =404; }
    location /admin/ { try_files $uri $uri/ /admin/index.html; }
    location /screen/ { try_files $uri $uri/ /screen/index.html; }
    location /user/ { try_files $uri $uri/ /user/index.html; }
    location / { return 404; }

    location /api/ {
        client_max_body_size 6m;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
