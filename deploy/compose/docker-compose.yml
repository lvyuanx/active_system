services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - active-media:/app/data/media

  admin-web:
    build:
      context: ../..
      dockerfile: deploy/docker/frontend.Dockerfile
      args:
        APP_DIR: admin-web
    ports:
      - "5173:80"
    depends_on:
      - backend

  screen-web:
    build:
      context: ../..
      dockerfile: deploy/docker/frontend.Dockerfile
      args:
        APP_DIR: screen-web
    ports:
      - "5174:80"
    depends_on:
      - backend

  user-web:
    build:
      context: ../..
      dockerfile: deploy/docker/frontend.Dockerfile
      args:
        APP_DIR: user-web
    ports:
      - "5175:80"
    depends_on:
      - backend

volumes:
  active-media:
