name: active-system
services:
  backend:
    image: active-system-backend:${RELEASE_TAG:?Run upgrade.sh}
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
    restart: unless-stopped
    expose: ["8000"]
    environment:
      APP_ENV: production
      DATABASE_PATH: /app/data/active_system.db
      MEDIA_ROOT: /app/data/media
      SUPERUSER_USERNAME: ${SUPERUSER_USERNAME:-admin}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:?Required}
      JWT_SECRET: ${JWT_SECRET:?Required}
      LOTTERY_SECURITY_CODE: ${LOTTERY_SECURITY_CODE:?Required}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-}
    volumes:
      - type: bind
        source: ${DATA_DIR:?Run upgrade.sh}
        target: /app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)
      interval: 5s
      timeout: 6s
      retries: 24
      start_period: 20s
  nginx:
    image: active-system-nginx:${RELEASE_TAG:?Run upgrade.sh}
    build:
      context: ../..
      dockerfile: deploy/docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/v1/health"]
      interval: 5s
      timeout: 6s
      retries: 24
      start_period: 10s
